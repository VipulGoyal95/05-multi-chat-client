# Name of the Spring Boot application
spring.application.name=multiple-chat-model
server.port=8081

spring.ai.bedrock.aws.region=${AWS_REGION}
spring.ai.bedrock.aws.access-key=${AWS_ACCESS_KEY}
spring.ai.bedrock.aws.secret-key=${AWS_SECRET_KEY}
spring.ai.model.chat=bedrock-converse

# ----------- MULTI-MODEL CONFIG -----------
# Passenger Support — Meta Llama 3 70B: conversational and empathetic
spring.ai.bedrock.converse.chat.passenger.model=meta.llama3-70b-instruct-v1:0

# Flight Operations — Mistral Mixtral 8x7B: fast and structured for rapid operational responses
spring.ai.bedrock.converse.chat.operations.model=anthropic.claude-3-sonnet-20240229-v1:0

# Travel Personalization — DeepSeek V3: strong reasoning for personalised loyalty advice
spring.ai.bedrock.converse.chat.personalization.model=deepseek.v3-v1:0

# Shared token budget across all three models
spring.ai.bedrock.converse.chat.options.max-tokens=800

logging.level.org.springframework.ai=DEBUG
